; Plugin-level engine config.
;
; NAMED Engine.ini, NOT DefaultEngine.ini, and that is not a style choice. UE 4.27's
; FPluginManager::IntegratePluginsIntoConfig takes the base filename of each ini in this
; folder and looks for a loaded config of that name - so "DefaultEngine.ini" makes it
; search for a config called "DefaultEngine", find nothing, and skip the file in silence.
; The destination name is what matches. The same applies to Input.ini next to this file.

[CoreRedirects]
; AReferenceCar was the early name for what is now ASaloonCar. The class was renamed
; before this project was under version control - it appears nowhere in Perforce or in
; the plugin's git history - but BP_Saloon and BP_referenceVehicle still record the old
; parent, so the editor refuses to open them with "derives from an invalid class".
;
; This is exactly what CoreRedirects exist for: the asset keeps its stored parent name
; and the engine resolves it to the current class at load. Without it the only remedies
; are deleting the Blueprints or rebuilding them by hand.
+ClassRedirects=(OldName="/Script/VehiclePhysics.ReferenceCar",NewName="/Script/VehiclePhysics.SaloonCar")
