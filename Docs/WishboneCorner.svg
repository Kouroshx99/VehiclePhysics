<svg xmlns="http://www.w3.org/2000/svg" style="background:#ffffff" viewBox="0 0 580 440" role="img" aria-label="Front view schematic of the double-wishbone corner showing hardpoints, arms, kingpin, coilover, wheel and contact patch">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4A5563"/>
    </marker>
  </defs>

  <!-- ground -->
  <line x1="150" y1="376" x2="545" y2="376" stroke="#4A5563" stroke-width="1.5"/>
  <g stroke="#7D8794" stroke-width="1">
    <line x1="160" y1="376" x2="150" y2="386"/><line x1="185" y1="376" x2="175" y2="386"/>
    <line x1="210" y1="376" x2="200" y2="386"/><line x1="235" y1="376" x2="225" y2="386"/>
    <line x1="260" y1="376" x2="250" y2="386"/><line x1="285" y1="376" x2="275" y2="386"/>
    <line x1="310" y1="376" x2="300" y2="386"/><line x1="335" y1="376" x2="325" y2="386"/>
    <line x1="360" y1="376" x2="350" y2="386"/><line x1="385" y1="376" x2="375" y2="386"/>
    <line x1="410" y1="376" x2="400" y2="386"/><line x1="435" y1="376" x2="425" y2="386"/>
    <line x1="460" y1="376" x2="450" y2="386"/><line x1="485" y1="376" x2="475" y2="386"/>
    <line x1="510" y1="376" x2="500" y2="386"/><line x1="535" y1="376" x2="525" y2="386"/>
  </g>

  <!-- chassis outline -->
  <path d="M60,50 L168,50 L168,80 L142,92 L142,315 L60,315 Z"
        fill="#EDF0F4" stroke="#4285E0" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.85"/>
  <text font-family="sans-serif" font-size="10.5" fill="#7D8794" x="72" y="196" transform="rotate(-90 72 196)">CHASSIS / BODY</text>

  <!-- wheel -->
  <circle cx="345" cy="228" r="148" fill="none" stroke="#2BB36C" stroke-width="1.5" opacity="0.5"/>

  <!-- displaced lower arm (bump) -->
  <line x1="126" y1="301" x2="316" y2="277" stroke="#E68126" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <circle cx="316" cy="277" r="4" fill="none" stroke="#E68126" stroke-width="1.3" opacity="0.6"/>

  <!-- theta arc -->
  <path d="M206,296 A 80 80 0 0 1 204,289" fill="none" stroke="#4A5563" stroke-width="1.4" marker-end="url(#arw)"/>
  <text font-family="monospace" font-size="12" fill="#14181E" x="196" y="322" font-style="italic">θ</text>

  <!-- lower arm -->
  <line x1="126" y1="301" x2="317" y2="304" stroke="#E68126" stroke-width="2.6"/>
  <!-- upper arm -->
  <line x1="126" y1="149" x2="317" y2="152" stroke="#E68126" stroke-width="2.6"/>
  <!-- arm to damper mount -->
  <line x1="251" y1="283" x2="317" y2="304" stroke="#E68126" stroke-width="1.2" opacity="0.55"/>

  <!-- kingpin -->
  <line x1="317" y1="304" x2="317" y2="152" stroke="#C440AC" stroke-width="2.4"/>
  <!-- coilover -->
  <line x1="150" y1="63" x2="251" y2="283" stroke="#DEB528" stroke-width="3.2"/>

  <!-- hub arm -->
  <line x1="317" y1="304" x2="345" y2="228" stroke="#2BB36C" stroke-width="1.6" stroke-dasharray="3 3"/>
  <!-- spindle -->
  <line x1="300" y1="228" x2="390" y2="228" stroke="#2BB36C" stroke-width="2.4"/>

  <!-- contact normal -->
  <line x1="345" y1="376" x2="345" y2="326" stroke="#DB3E34" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- chassis-fixed points: squares -->
  <rect x="121" y="296" width="10" height="10" fill="#4285E0"/>
  <rect x="121" y="144" width="10" height="10" fill="#4285E0"/>
  <rect x="145" y="58"  width="10" height="10" fill="#DEB528"/>

  <!-- moving points: circles -->
  <circle cx="317" cy="304" r="5.5" fill="#E68126"/>
  <circle cx="317" cy="152" r="5.5" fill="#E68126"/>
  <circle cx="251" cy="283" r="5"   fill="#DEB528"/>
  <circle cx="345" cy="228" r="5"   fill="#2BB36C"/>
  <circle cx="345" cy="376" r="5"   fill="#DB3E34"/>

  <!-- labels -->
  <text font-family="monospace" font-size="12" fill="#14181E" x="96"  y="292">F<tspan font-size="9" dy="3">L</tspan><tspan dy="-3">,B</tspan><tspan font-size="9" dy="3">L</tspan></text>
  <text font-family="monospace" font-size="12" fill="#14181E" x="96"  y="140">F<tspan font-size="9" dy="3">U</tspan><tspan dy="-3">,B</tspan><tspan font-size="9" dy="3">U</tspan></text>
  <text font-family="monospace" font-size="12" fill="#14181E" x="150" y="46">T</text>
  <text font-family="monospace" font-size="12" fill="#14181E" x="328" y="322">L</text>
  <text font-family="monospace" font-size="12" fill="#14181E" x="328" y="146">U</text>
  <text font-family="monospace" font-size="12" fill="#14181E" x="232" y="272">D</text>
  <text font-family="monospace" font-size="12" fill="#14181E" x="356" y="220">W</text>
  <text font-family="monospace" font-size="12" fill="#14181E" x="356" y="396">C</text>
  <text font-family="sans-serif" font-size="10.5" fill="#7D8794"   x="352" y="352">N</text>
  <text font-family="sans-serif" font-size="10.5" fill="#7D8794"   x="188" y="180" transform="rotate(65 188 180)">COILOVER</text>
  <text font-family="sans-serif" font-size="10.5" fill="#7D8794"   x="325" y="240" transform="rotate(-90 325 240)">KINGPIN</text>
  <text font-family="sans-serif" font-size="10.5" fill="#7D8794"   x="430" y="120">TYRE</text>
  <text font-family="sans-serif" font-size="10.5" fill="#7D8794"   x="196" y="296">bump</text>
</svg>
